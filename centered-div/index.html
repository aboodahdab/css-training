<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div class="wrapper">
      <div>
        <h2>sign in</h2>
        <p>enter your criedtinals to access your account</p>
      </div>
      <div class="inputs-div">
        <input type="email" placeholder="email address" />
      </div>
      <div class="inputs-div">
        <div class="label2">
          <input
            type="password"
            placeholder="password"
            class="password-input"
          />
          <img src="eyeicon.svg" class="eye-icon" alt="" />
        </div>
      </div>
      <div class="remember-div">
        <label for="">
          <input type="checkbox" />
          rememeber me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>
      <div class="inputs-div" style="margin-bottom: 16px">
        <button class="btn">sign in</button>
      </div>
      <div class="rem">
        <label for=""
          >Don't have an account?
          <a href="#" class="forgot">create one</a></label
        >
      </div>
    </div>

    <script src="js.js"></script>
  </body>
</html>
