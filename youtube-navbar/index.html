<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="nav-left">
        <div class="ham-div">
          <img
            src="hamburgermenuicon.svg"
            class="img"
            style="background: white; margin-right: 2px"
            alt=""
          />
        </div>
        <img src="youtubelogo.png" class="img" style="height: 20px" alt="" />
        <h2>YouTube</h2>
      </div>

      <div class="nav-center">
        <input type="search" name="" id="input-search" placeholder="search" />
        <button class="search-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="white"
            viewBox="0 0 24 24"
          >
            <path
              d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"
            />
          </svg>
        </button>
        <div class="mic-div">
          <span class="material-icons" style="color: white">mic</span>
        </div>
      </div>
      <div class="nav-right">
        <button class="upload-video">
          <span class="material-icons" style="color: white; font-size: 24px"
            >add</span
          >

          <span style="font-size: 14px"> create</span>
        </button>
        <div id="notfication">
          <span class="material-icons" style="color: white; font-size: 24px"
            >notifications
          </span>
        </div>
        <div>
          <img
            src="https://yt3.ggpht.com/yti/ANjgQV8NdnNQbrWDSFWc9po_0uGELVwvT2yg2YxyteEUDVw=s88-c-k-c0x00ffffff-no-rj"
            class="circle-img"
            alt=""
          />
        </div>
      </div>
    </div>
  </body>
</html>
